name: Deploy DÉCIMA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /decima-edicoes
      NEXT_PUBLIC_SITE_URL: https://navesz.github.io/decima-edicoes
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check source quality
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify exported site
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify published site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          site_url="${PAGE_URL%/}"
          probe_dir="${RUNNER_TEMP}/decima-smoke"
          mkdir -p "$probe_dir"
          published=false

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              "${site_url}/?revision=${EXPECTED_REVISION}" \
              --output "${probe_dir}/home.html" \
              && grep --fixed-strings --quiet \
                "<meta name=\"build-revision\" content=\"${EXPECTED_REVISION}\"" \
                "${probe_dir}/home.html"; then
              published=true
              break
            fi
            sleep 5
          done

          test "$published" = true

          curl --fail --silent --show-error --location \
            --dump-header "${probe_dir}/manifest.headers" \
            "${site_url}/manifest.webmanifest?revision=${EXPECTED_REVISION}" \
            --output "${probe_dir}/manifest.json"
          grep --ignore-case --quiet '^content-type: application/manifest+json' \
            "${probe_dir}/manifest.headers"
          grep --fixed-strings --quiet '"scope":"/decima-edicoes/"' "${probe_dir}/manifest.json"

          curl --fail --silent --show-error --location \
            "${site_url}/colecoes/nordica-yggdrasil/?revision=${EXPECTED_REVISION}" \
            --output "${probe_dir}/product.html"
          grep --fixed-strings --quiet 'Nórdica — Yggdrasil' "${probe_dir}/product.html"

          curl --fail --silent --show-error --head \
            --dump-header "${probe_dir}/image.headers" \
            "${site_url}/images/hero-yggdrasil-480.webp?revision=${EXPECTED_REVISION}" \
            --output /dev/null
          grep --ignore-case --quiet '^content-type: image/webp' \
            "${probe_dir}/image.headers"

          missing_status="$(curl --silent --show-error --location \
            "${site_url}/__deploy-probe-${EXPECTED_REVISION}/" \
            --output "${probe_dir}/404.html" \
            --write-out '%{http_code}')"
          test "$missing_status" = 404
          grep --fixed-strings --quiet '<meta name="robots" content="noindex"' "${probe_dir}/404.html"
